.box.on video{display:block}.box.on .ph{display:none}
.ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;text-align:center;cursor:pointer;padding:12px;font-weight:600}
.ph svg{width:clamp(48px,12vw,96px);animation:drift 5s ease-in-out infinite}

.tag{position:absolute;top:-16px;left:18px;background:var(--deep);color:#fff;font-family:"Pacifico",cursive;padding:3px 16px;border-radius:99px;transform:rotate(-4deg);z-index:2}
.cn{position:absolute;width:44px;z-index:2}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:36px 0 22px}
.note{background:var(--card);border:3px dashed var(--pink);border-radius:24px;padding:16px 18px;text-align:center;transition:transform .2s}
.note:hover{transform:translateY(-6px) rotate(-1deg)}
.note .e{font-size:2rem;display:block}
.cta{text-align:center;position:relative}
.cta button{font:inherit;font-weight:700;font-size:1.15rem;color:#fff;background:var(--deep);border:0;border-radius:99px;padding:14px 30px;cursor:pointer;box-shadow:0 6px 0 #a8305c;transition:transform .1s,box-shadow .1s}

.cta p{font-family:"Pacifico",cursive;color:var(--deep);min-height:1.6em;margin:16px 0 0;font-size:1.3rem}
.cta .sm{width:90px;display:inline-block;vertical-align:middle;animation:bob 3s ease-in-out infinite}
footer{text-align:center;padding:14px;font-size:.9rem;opacity:.85}
.fall{position:fixed;top:-60px;width:34px;pointer-events:none;z-index:50;animation:fall linear forwards}
@media (max-width:640px){.vids{grid-template-columns:1fr}.hero{grid-template-columns:1fr 1fr;grid-template-areas:"t t" "a b"}.hero>div{grid-area:t}.hero .sm{grid-row:2}}
